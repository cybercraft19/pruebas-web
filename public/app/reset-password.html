<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elegir nueva contraseña — Sistema de Pruebas</title>
  <link rel="icon" type="image/png" href="/app/assets/img/favicon.png" />
  <link rel="stylesheet" href="/app/assets/css/style.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand-mark"><img src="/app/assets/img/pentum-icon.png" alt="Pentum" /></div>
      <h1>Elegí tu nueva contraseña</h1>
      <p class="muted" id="email-hint"></p>

      <form id="reset-form">
        <label for="password">Contraseña nueva</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" />

        <label for="password_confirmation">Repetí la contraseña</label>
        <input type="password" id="password_confirmation" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" />

        <button type="submit" class="block" id="submit-btn">Guardar contraseña</button>
      </form>
      <div class="error" id="error"></div>
      <div class="success" id="success"></div>

      <p style="text-align:center;margin-top:14px">
        <a class="link" href="/app/login.html" style="font-size:0.85rem">Volver a iniciar sesión</a>
      </p>
    </div>
  </div>

  <script src="/app/assets/js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const email = params.get('email');

    document.getElementById('email-hint').textContent = email
      ? `Para la cuenta ${email}.`
      : 'Este enlace no es válido.';

    if (!token || !email) {
      document.getElementById('reset-form').style.display = 'none';
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error');
      const successBox = document.getElementById('success');
      const submitBtn = document.getElementById('submit-btn');
      errorBox.textContent = '';
      successBox.textContent = '';

      const password = document.getElementById('password').value;
      const confirmacion = document.getElementById('password_confirmation').value;
      if (password !== confirmacion) {
        errorBox.textContent = 'Las contraseñas no coinciden.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Guardando…';

      try {
        const data = await Api.post('/api/reset-password', {
          token,
          email,
          password,
          password_confirmation: confirmacion,
        });
        successBox.textContent = `${data.message} Ya podés iniciar sesión.`;
        e.target.style.display = 'none';
      } catch (err) {
        errorBox.textContent = formatError(err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar contraseña';
      }
    });
  </script>
</body>
</html>
