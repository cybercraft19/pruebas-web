          <strong>Sistema de Pruebas</strong>

      <nav class="sidebar__nav">

      <div class="sidebar__footer">
        <div class="avatar" id="user-avatar">E</div>
        <div class="user-meta">
          <strong id="user-name">—</strong>
          <span>Evaluador</span>
        </div>
        <button class="icon-btn" id="logout-btn" title="Cerrar sesión" aria-label="Cerrar sesión"></button>
      </div>
    </aside>

    <div class="main">
      <header class="main__topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menú"></button>
        <a class="link" href="/app/evaluador/mis-pruebas.html" style="display:inline-flex;align-items:center;gap:6px;font-size:0.85rem" id="volver-link">Volver a mis pruebas</a>
      </header>

      <div class="main__content">
        <div class="container">
          <div class="card">
            <div class="flex-between" id="prueba-header-view">
              <div>
                <div class="flex-between" style="justify-content: flex-start; gap: 12px">
                  <h1 id="titulo" style="font-size:1.3rem">Prueba</h1>
                  <span class="badge" id="estado-badge"></span>
                </div>
                <p id="instrucciones" class="muted" style="margin-top:8px"></p>
              </div>
              <div style="display:flex;gap:8px;flex-shrink:0">
                <button type="button" class="secondary" id="editar-btn"></button>
                <button id="publicar-btn"></button>
              </div>
            </div>

            <form id="editar-form" style="display:none">
              <label for="editar-titulo">Título</label>
              <input type="text" id="editar-titulo" required maxlength="255" />

              <label for="editar-instrucciones">Instrucciones</label>
              <textarea id="editar-instrucciones" rows="2"></textarea>

              <div class="flex-between" style="margin-top:14px">
                <button type="button" class="secondary" id="cancelar-editar-btn">Cancelar</button>
                <button type="submit" id="guardar-editar-btn"></button>
              </div>
              <div class="error" id="editar-error"></div>
            </form>
          </div>

          <div class="card" id="categorias-card">
            <div class="section-title">Categorías y tipo de puntuación</div>
            <div class="categorias-grid" id="categorias-body"></div>
          </div>

          <div class="card" id="preguntas-card">
            <details class="details-toggle" open>
              <summary>
                <span>Preguntas</span>
                <span class="muted" id="preguntas-count"></span>
              </summary>
              <div id="preguntas-body" style="margin-top:14px"></div>
            </details>
          </div>

          <div class="card" id="tmt-card" style="display:none">
            <div class="section-title">Diseño del Trail Making Test</div>
            <div class="stats-grid" id="tmt-resumen"></div>
          </div>

          <div class="card">
            <div class="flex-between" style="margin-bottom: 16px">
              <div class="section-title" style="margin-bottom: 0">Resultados de estudiantes</div>
              <button type="button" class="secondary small" id="exportar-resultados-btn"></button>
            </div>
            <div style="overflow-x:auto">
              <table id="resultados-table" class="display" style="width:100%">
                <thead id="resultados-head"></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/app/assets/js/api.js?v=20260831"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script src="/app/assets/js/evaluador-prueba.js?v=20260831"></script>
</body>
</html>
