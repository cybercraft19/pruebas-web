<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crear cuenta — Sistema de Pruebas</title>
  <link rel="icon" type="image/png" href="/app/assets/img/favicon.png" />
  <link rel="stylesheet" href="/app/assets/css/style.css?v=20260921" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card" style="max-width:460px">
      <div class="brand-mark"><img src="/app/assets/img/pentum-logo.png" alt="Pentum" /></div>
      <h1>Creá tu cuenta de estudiante</h1>
      <p class="muted">Completá tus datos para empezar a presentar pruebas.</p>

      <form id="registro-form">
        <label for="name">Nombre completo</label>
        <input type="text" id="name" required placeholder="Nombre y apellido" />

        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username" placeholder="nombre@correo.com" />

        <label for="password">Contraseña</label>
        <div class="password-field">
          <input type="password" id="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres" />
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Mostrar contraseña"></button>
        </div>

        <div class="form-row">
          <div>
            <label for="cedula">Cédula</label>
            <input type="text" id="cedula" required placeholder="Documento de identidad" />
          </div>
          <div>
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" required placeholder="Tu número de contacto" />
          </div>
        </div>

        <label for="fecha_nacimiento">Fecha de nacimiento</label>
        <input type="date" id="fecha_nacimiento" required />

        <div class="form-row">
          <div>
            <label for="acudiente_nombre">Nombre del acudiente/tutor</label>
            <input type="text" id="acudiente_nombre" required placeholder="Nombre completo" />
          </div>
          <div>
            <label for="acudiente_telefono">Teléfono del acudiente/tutor</label>
            <input type="tel" id="acudiente_telefono" required placeholder="Número de contacto" />
          </div>
        </div>

        <button type="submit" class="block" id="submit-btn" style="margin-top:14px">Crear cuenta</button>
        <div class="error" id="error"></div>
      </form>

      <p style="text-align:center;margin-top:14px">
        <a class="link" href="/app/login.html" style="font-size:0.85rem">Ya tengo cuenta, iniciar sesión</a>
      </p>
    </div>
  </div>

  <script src="/app/assets/js/api.js?v=20260921"></script>
  <script>
    document.getElementById('toggle-password').innerHTML = Icons.eye;

    const passwordInput = document.getElementById('password');
    document.getElementById('toggle-password').addEventListener('click', (e) => {
      const btn = e.currentTarget;
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? Icons.eye : Icons.eyeOff;
    });

    document.getElementById('registro-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error');
      const submitBtn = document.getElementById('submit-btn');
      errorBox.textContent = '';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Creando cuenta…';

      try {
        const data = await Api.post('/api/registro', {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: passwordInput.value,
          cedula: document.getElementById('cedula').value,
          telefono: document.getElementById('telefono').value,
          fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
          acudiente_nombre: document.getElementById('acudiente_nombre').value,
          acudiente_telefono: document.getElementById('acudiente_telefono').value,
        });

        window.location.href = '/app/estudiante/index.html';
      } catch (err) {
        errorBox.textContent = formatError(err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
