<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — Sistema de Pruebas</title>
  <link rel="stylesheet" href="/app/assets/css/style.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card">
      <h2>Sistema de Pruebas</h2>
      <p class="muted">Inicia sesión con tu correo y contraseña.</p>
      <form id="login-form">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username" />

        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password" />

        <button type="submit">Entrar</button>
        <div class="error" id="error"></div>
      </form>
    </div>
  </div>

  <script src="/app/assets/js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error');
      errorBox.textContent = '';

      try {
        const data = await Api.post('/api/login', {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        });

        window.location.href = data.user.role === 'evaluador'
          ? '/app/evaluador/index.html'
          : '/app/estudiante/index.html';
      } catch (err) {
        errorBox.textContent = formatError(err);
      }
    });
  </script>
</body>
</html>
