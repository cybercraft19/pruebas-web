<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión — Sistema de Pruebas</title>
  <link rel="icon" type="image/png" href="/app/assets/img/favicon.png" />
  <link rel="stylesheet" href="/app/assets/css/style.css?v=20260921b" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand-mark"><img src="/app/assets/img/pentum-logo.png" alt="Pentum" /></div>
      <h1>Sistema de Pruebas</h1>
      <p class="muted">Inicia sesión con tu correo y contraseña.</p>

      <form id="login-form">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username" placeholder="nombre@correo.com" />

        <label for="password">Contraseña</label>
        <div class="password-field">
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
          <button type="button" class="password-toggle" id="toggle-password" aria-label="Mostrar contraseña"></button>
        </div>

        <button type="submit" class="block" id="submit-btn">Entrar</button>
        <div class="error" id="error"></div>
      </form>

      <p style="text-align:center;margin-top:14px">
        <a class="link" href="/app/forgot-password.html" style="font-size:0.85rem">¿Olvidaste tu contraseña?</a>
      </p>
      <p style="text-align:center;margin-top:8px">
        <a class="link" href="/app/registro.html" style="font-size:0.85rem">¿Sos estudiante y no tenés cuenta? Registrate</a>
      </p>

      <p class="login-footer">Acceso exclusivo para evaluadores y estudiantes registrados.</p>
    </div>
  </div>

  <script src="/app/assets/js/api.js?v=20260921b"></script>
  <script>
    document.getElementById('toggle-password').innerHTML = Icons.eye;

    const passwordInput = document.getElementById('password');
    document.getElementById('toggle-password').addEventListener('click', (e) => {
      const btn = e.currentTarget;
      const showing = passwordInput.type === 'text';
      passwordInput.type = showing ? 'password' : 'text';
      btn.innerHTML = showing ? Icons.eye : Icons.eyeOff;
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error');
      const submitBtn = document.getElementById('submit-btn');
      errorBox.textContent = '';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Entrando…';

      try {
        const data = await Api.post('/api/login', {
          email: document.getElementById('email').value,
          password: passwordInput.value,
        });

        window.location.href = data.user.role === 'evaluador'
          ? '/app/evaluador/index.html'
          : '/app/estudiante/index.html';
      } catch (err) {
        errorBox.textContent = formatError(err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
