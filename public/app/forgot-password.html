<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar contraseña — Sistema de Pruebas</title>
  <link rel="icon" type="image/png" href="/app/assets/img/favicon.png" />
  <link rel="stylesheet" href="/app/assets/css/style.css?v=20260921b" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand-mark"><img src="/app/assets/img/pentum-logo.png" alt="Pentum" /></div>
      <h1>Recuperar contraseña</h1>
      <p class="muted">Escribí tu correo y te enviamos un enlace para elegir una contraseña nueva.</p>

      <form id="forgot-form">
        <label for="email">Correo</label>
        <input type="email" id="email" required autocomplete="username" placeholder="nombre@correo.com" />

        <button type="submit" class="block" id="submit-btn">Enviar enlace</button>
        <div class="error" id="error"></div>
        <div class="success" id="success"></div>
      </form>

      <p style="text-align:center;margin-top:14px">
        <a class="link" href="/app/login.html" style="font-size:0.85rem">Volver a iniciar sesión</a>
      </p>
    </div>
  </div>

  <script src="/app/assets/js/api.js?v=20260921b"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('error');
      const successBox = document.getElementById('success');
      const submitBtn = document.getElementById('submit-btn');
      errorBox.textContent = '';
      successBox.textContent = '';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Enviando…';

      try {
        const data = await Api.post('/api/forgot-password', {
          email: document.getElementById('email').value,
        });
        successBox.textContent = data.message;
        e.target.reset();
      } catch (err) {
        errorBox.textContent = formatError(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar enlace';
      }
    });
  </script>
</body>
</html>
