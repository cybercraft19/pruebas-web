<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi historial — Sistema de Pruebas</title>
  <link rel="icon" type="image/png" href="/app/assets/img/favicon.png" />
  <link rel="stylesheet" href="/app/assets/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand-mark"><img src="/app/assets/img/pentum-lockup.png" alt="Pentum" /></div>
        <div class="sidebar__brand-text">
          <strong>Sistema de Pruebas</strong>
          <span>Panel del estudiante</span>
        </div>
      </div>
      <nav class="sidebar__nav">
        <div class="nav-section">General</div>
        <a class="nav-link" href="/app/estudiante/index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          Pruebas disponibles
        </a>
        <a class="nav-link active" href="/app/estudiante/historial.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/><polyline points="12 7 12 12 16 14"/></svg>
          Mi historial
        </a>
      </nav>
      <div class="sidebar__footer">
        <div class="avatar" id="user-avatar">E</div>
        <div class="user-meta">
          <strong id="user-name">—</strong>
          <span>Estudiante</span>
        </div>
        <button class="icon-btn" id="logout-btn" title="Cerrar sesión" aria-label="Cerrar sesión"></button>
      </div>
    </aside>

    <div class="main">
      <header class="main__topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menú"></button>
        <div class="main__topbar-titles">
          <strong>Mi historial</strong>
          <span>Pruebas que ya presentaste</span>
        </div>
      </header>

      <div class="main__content">
        <div class="container">
          <div class="card">
            <div class="section-title">Mi historial</div>
            <div style="overflow-x:auto">
              <table>
                <thead><tr><th>Prueba</th><th>Estado</th><th></th></tr></thead>
                <tbody id="historial-body">
                  <tr class="skeleton-row"><td colspan="3"><div class="skeleton-bar"></div></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/app/assets/js/api.js"></script>
  <script src="/app/assets/js/estudiante-historial.js"></script>
</body>
</html>
