<!doctype html>
<html lang="es">
<head>

          <strong>Sistema de Pruebas</strong>
          <span>Panel del estudiante</span>
        </div>
      </div>
      <nav class="sidebar__nav">
        <div class="nav-section">General</div>
        <a class="nav-link active" href="/app/estudiante/index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>

        </a>

        </div>
        <button class="icon-btn" id="logout-btn" title="Cerrar sesión" aria-label="Cerrar sesión"></button>
      </div>
    </aside>

    <div class="main">
      <header class="main__topbar">
        <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menú"></button>
        <div class="main__topbar-titles">
          <strong>Pruebas disponibles</strong>
          <span>Elegí una prueba para comenzar</span>
        </div>
      </header>

      <div class="main__content">
        <div class="container">
          <div class="page-header">
            <div>
              <h1 class="page-header__greeting">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/></svg>

              <p>Estas son las pruebas disponibles para ti. Elige una para comenzar.</p>

          <div class="card">
            <div class="section-title">Pruebas disponibles</div>
            <div class="test-grid" id="disponibles-grid">
              <div class="skeleton-bar" style="height:150px;border-radius:var(--radius-md)"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/app/assets/js/api.js"></script>
  <script src="/app/assets/js/estudiante-dashboard.js"></script>
